# Publishes a release: push a tag like v0.2.0 (matching "version" in package.json), or run
# this workflow by hand. The installer, latest.yml and the blockmap go to a GitHub Release,
# which is where installed copies of AI Write look for updates.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish the Windows installer
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match package.json version $version. Bump the version first."
            exit 1
          fi

      # The notes are what Adam reads on the release page and under "What's new" in the app, so a
      # version can't go out with the previous version's notes.
      - name: Check the release notes are for this version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          first=$(head -n 1 build/release-notes.md | tr -d '\r')
          if [ "$first" != "<!-- version: $version -->" ]; then
            echo "::error::build/release-notes.md isn't for $version. Write this version's notes there, starting with the line <!-- version: $version -->."
            exit 1
          fi

      - name: Install
        run: npm ci

      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npx vitest run

      # electron-builder uploads the installer, the blockmap and latest.yml at the same time. If the
      # release doesn't exist yet, each upload tries to create it and only the first succeeds
      # ("Published releases must have a valid tag"). So start the release as a draft first: every
      # upload goes to it, and it's published only once all three files are there, so installed
      # copies never see a half-uploaded version. Its text is build/release-notes.md, which
      # electron-builder also puts in latest.yml for the app's "What's new".
      - name: Start the release as a draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          if ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "v$version" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" --title "$version" --notes-file build/release-notes.md
          else
            gh release edit "v$version" --repo "$GITHUB_REPOSITORY" --notes-file build/release-notes.md
          fi

      - name: Build and publish
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$(node -p "require('./package.json').version")" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      - name: Keep a copy of the installer on the run
        uses: actions/upload-artifact@v4
        with:
          name: AI-Write-Windows-installer
          path: |
            release/*.exe
            release/latest.yml
          if-no-files-found: error
