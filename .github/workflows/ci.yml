# Checks pull requests (once per push) and main after each merge, and builds a Windows
# installer Adam can download from the run's "Artifacts" section (AI-Write-Windows-installer).
# A branch with no pull request isn't checked on push; run it by hand from the Actions tab
# ("Run workflow"). Every job runs on Windows: the app is Windows only.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request stops the older run. Runs on main are never
# stopped, so every merge gets checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Typecheck and unit tests
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

  # The app tests are split into 4 parts that run side by side. Each part builds the app
  # itself (the build takes seconds), so no part waits on another.
  app-tests:
    name: App tests (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The runner's screen starts at 1024x768, smaller than the app's 1440x900 window, so Windows shrinks the window
      # and the binder folds away (the narrow layout). Linux CI used a 1440x900 virtual screen; this matches it and more.
      - name: Screen size 1920x1080
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: App tests (Playwright driving the built app)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Keep the test report
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}-of-4
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  windows-installer:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the installer
        run: npm run dist:win

      - name: Check the installer holds only the app
        run: node build/check-package.mjs release/win-unpacked/resources/app.asar --native win32-x64

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Write-Windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
