name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit-checks:
    name: Unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

  build-app:
    name: Build app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aiwrite-build
          path: out/
          if-no-files-found: error
          retention-days: 7

  app-tests:
    name: App tests (${{ matrix.shard }}/4)
    needs: build-app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: aiwrite-build
          path: out

      - name: Install
        run: npm ci

      - name: App tests (Playwright)
        run: npx playwright test --shard=${{ matrix.shard }}/4

      - name: Keep the test report
        if: ${{ !success() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shard }}-of-4
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  windows-installer:
    name: Windows installer
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build-app
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the installer
        run: npm run dist:win

      - name: Check the installer holds only the app
        run: node build/check-package.mjs release/win-unpacked/resources/app.asar --native win32-x64

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AI-Write-Windows-installer
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

  perf-tests:
    name: Performance checks
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Run performance tests
        run: npx vitest run tests/unit/searchPerf.test.ts src/main/entryViews/perf.test.ts
